name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Data and pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the vendor register
        run: node scripts/validate-data.mjs

      - name: Test the validator's own rules
        run: node scripts/test-validate.mjs

      - name: Check every page parses and its links resolve
        run: node scripts/check-pages.mjs
